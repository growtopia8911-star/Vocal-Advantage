[[package]]
name = "vocal-advantage"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "ctranslate2" },
    { name = "faster-whisper" },
    { name = "keyboard", marker = "sys_platform == 'win32'" },
    { name = "numpy" },
    { name = "nvidia-cublas-cu12", marker = "sys_platform == 'win32'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'win32'" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin'" },
    { name = "pywin32", marker = "sys_platform == 'win32'" },
    { name = "sounddevice" },
]

[package.optional-dependencies]
dev = [
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "ctranslate2", specifier = "==4.8.1" },
    { name = "faster-whisper", specifier = "==1.2.1" },
    { name = "keyboard", marker = "sys_platform == 'win32'", specifier = "==0.13.5" },
    { name = "numpy" },
    { name = "nvidia-cublas-cu12", marker = "sys_platform == 'win32'" },
    { name = "nvidia-cudnn-cu12", marker = "sys_platform == 'win32'", specifier = "==9.*" },
    { name = "pyobjc-framework-quartz", marker = "sys_platform == 'darwin'" },
    { name = "pytest", marker = "extra == 'dev'", specifier = ">=8.0" },
    { name = "pywin32", marker = "sys_platform == 'win32'" },
    { name = "sounddevice", specifier = "==0.5.6" },
]
provides-extras = ["dev"]
