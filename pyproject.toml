[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vocal-advantage"
version = "0.1.0"
description = "Local hold-to-talk dictation for Windows. Audio never leaves the machine."
requires-python = ">=3.12"

# Pins copied verbatim from SPEC.md ("Pinned deps"). Where the spec gives no
# version (nvidia-cublas-cu12, pywin32, numpy) none is invented here.
# Deliberately absent: torch. The spec forbids it in this venv.
#
# The sys_platform markers are not in the spec and are not a change of plan:
# pywin32 and the two NVIDIA CUDA wheels publish no macOS build at all, so
# without them `pip install -e ".[dev]"` fails outright on a Mac and none of
# the portable modules (recorder, controller, config, hotkey_spec,
# transcriber) can be worked on there. On Windows the resolved set is
# unchanged.
#
# `keyboard` is marked the same way for a sharper reason: it *does* install on
# macOS (dragging in all of pyobjc), and then `import keyboard` aborts the
# interpreter -- its Carbon CFDataGetBytes call trips a CoreFoundation
# assertion and raises SIGABRT, exit 134, uncatchable. Leaving it installed on
# a Mac makes the whole test suite die on first contact.
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.1",
    "nvidia-cublas-cu12; sys_platform == 'win32'",
    "nvidia-cudnn-cu12==9.*; sys_platform == 'win32'",
    "sounddevice==0.5.6",
    "keyboard==0.13.5; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
    # macOS only. The event tap for the key hook and CGEvent/NSPasteboard
    # for the paste. 6.9 MB. Not installed on Windows.
    "pyobjc-framework-Quartz; sys_platform == 'darwin'",
    "numpy",
    # The tray icon and the Windows overlay are both drawn at runtime with
    # Pillow, which is what keeps image files out of the repository. Needed on
    # both platforms: macOS uses it for the menu-bar template image.
    "pillow",
    # The Windows tray icon only. macOS uses NSStatusItem directly -- pystray's
    # run() must own the main thread there, which the overlay's NSApplication
    # already needs, and pystray cannot mark an image as a template so the icon
    # would not adapt to a light menu bar.
    "pystray; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["vocal_advantage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the real 1.6 GB model and a GPU; deselected by default, run with `pytest -m slow`",
]
addopts = ["-m", "not slow"]
# Puts the repo root on sys.path so `import vocal_advantage` resolves to the
# working tree even if someone runs pytest without installing the package.
# A later task adds `markers` and `addopts` to this section. Those are
# additions: the two keys below must stay, or every test fails at collection
# with ModuleNotFoundError: No module named 'vocal_advantage'.
pythonpath = ["."]
