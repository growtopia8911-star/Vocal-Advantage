# Runs the suite on both machines this project is developed on.
#
# Why both: hotkey_spec, flowbar_win and the paste layer all branch on
# sys.platform, and the branch not taken is not tested. On 2026-08-20 two
# hotkey tests that had been green on macOS for days failed the first time a
# Windows machine ran them -- they had never reached the code they cover. A
# macOS-only suite is not evidence about Windows, and the reverse is just as
# true.
name: tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The same command the README and the handover notes give a human, so
      # CI proves the documented path and not a special one.
      - name: Install
        run: pip install -e ".[dev]"

      # `python -m pytest`, never bare `pytest`: the latter misses the repo
      # root on sys.path and fails at collection with
      # ModuleNotFoundError: No module named 'vocal_advantage'.
      - name: Test
        run: python -m pytest -q
